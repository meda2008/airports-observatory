<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="查看机场套餐价格、支付方式与退款条件，快速找到适合自己的套餐。"><title>航向 · 机场套餐比较</title><link rel="stylesheet" href="/index.css"><script defer src="/index.js"></script></head>
<body><header class="header"><a class="brand" href="#"><span class="brand-mark">航</span><span>航向<small>机场套餐比较</small></span></a><nav aria-label="主导航"><a href="#catalog">机场列表</a><a href="#compare">按预算找套餐</a></nav></header>
<main id="home"><section class="hero"><p class="eyebrow">找到适合你的机场</p><h1>先看价格，<br>再看是否适合。</h1><p class="hero-copy">价格、流量、支付和退款条件，一眼看清。</p><a class="button" href="#catalog">浏览机场 <span aria-hidden="true">↘</span></a><div class="hero-tags"><span>套餐价格</span><span>支付方式</span><span>速度与稳定性</span><span>运营年限</span></div></section>
<section id="catalog" class="section"><div class="section-heading"><h2>机场列表</h2><p id="catalog-meta" class="muted" role="status"></p></div><form id="catalog-form" class="filter-bar"><input name="scope" type="hidden" value="primary"><label class="grow">搜索机场<input name="q" type="search" placeholder="名称或关键词" maxlength="200"></label><label>支付方式<input name="payment" placeholder="例如：支付宝" maxlength="80"></label><label>价格<select name="price"><option value="">全部</option><option value="available">有报价</option><option value="missing">暂无报价</option></select></label><button type="submit">查找</button><button id="catalog-reset" class="button-secondary" type="button">重置</button></form><div id="catalog-error" class="error" role="alert" hidden></div><div id="catalog-results" class="card-grid" aria-live="polite"></div><div class="pagination"><button id="previous" class="button-secondary" type="button">上一页</button><span id="page-label"></span><button id="next" class="button-secondary" type="button">下一页</button></div></section>
<section id="compare" class="section comparison"><div class="section-heading"><div><p class="eyebrow">按你的需求选</p><h2>预算内，有哪些选择？</h2></div></div><form id="search" class="filter-bar"><label class="grow">你的需求<input name="needs" placeholder="例如：每月20元以内" maxlength="300"></label><label>优先考虑<select name="criterion"><option value="cheap">价格便宜</option><option value="value">流量性价比</option><option value="speed">速度</option><option value="stability">稳定性</option></select></label><label>币种<select name="currency"><option value="CNY">人民币 CNY</option><option value="USD">美元 USD</option><option value="EUR">欧元 EUR</option><option value="HKD">港币 HKD</option><option value="JPY">日元 JPY</option><option value="GBP">英镑 GBP</option><option value="TWD">新台币 TWD</option></select></label><label>每月预算<input name="maxMonthly" type="number" min="0.01" step="0.01" placeholder="不限"></label><button type="submit">找套餐</button></form><p id="status" role="status" class="muted">设置预算，比较套餐。</p><div id="results" class="card-grid"></div></section></main>
<main id="detail" class="detail-shell" hidden><a class="back-link" href="#catalog">← 返回机场列表</a><div id="detail-content" aria-live="polite"></div></main>
<footer><span class="brand">航向</span><p>价格以网站结算为准。暂无实测时，不提供速度或稳定性排名。部分入口为推广链接。</p><a href="/console.html">管理后台</a></footer></body></html>
