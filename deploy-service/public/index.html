<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="查看已复核的机场套餐标价、流量额度、支付方式与退款条件，按预算快速筛选对比。">
  <title>航向 · 机场套餐目录与比价</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315232c'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='white' font-size='18' font-family='sans-serif' font-weight='bold'%3E%E8%88%AA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/index.css">
  <script defer src="/plan-conditions.js"></script>
  <script defer src="/index.js"></script>
</head>
<body class="public-directory">
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#compare"><span class="directory-mark" aria-hidden="true"></span><span class="brand-title">航向</span></a>
      <nav aria-label="主导航" class="main-nav">
        <a href="#catalog" id="catalog-nav">机场列表</a>
        <a href="#compare" id="plan-nav">找套餐</a>
        <button id="open-plan-comparison" class="compare-trigger" type="button" aria-haspopup="dialog" disabled>查看对比 <span id="plan-selection-count">0/3</span></button>
      </nav>
    </div>
  </header>

  <main id="home">
    <section id="compare" class="plan-directory" aria-labelledby="plan-title">
      <form id="search">
        <div class="plan-hero">
          <div class="directory-wrap plan-hero-inner">
            <div>
              <h1 id="plan-title">找到合适的套餐</h1>
              <p>看清套餐价格、付款周期和流量，再比每天和每 GB 的费用。</p>
            </div>
            <div class="plan-filter">
              <label class="plan-query"><span>服务商或套餐</span><input name="q" type="search" placeholder="输入名称或编号" maxlength="200"></label>
              <label><span>月均预算</span><input name="maxMonthly" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="不限"></label>
              <label><span>币种</span>
                <select name="currency">
                  <option value="CNY">人民币</option><option value="USD">美元</option><option value="EUR">欧元</option>
                  <option value="HKD">港币</option><option value="JPY">日元</option><option value="GBP">英镑</option><option value="TWD">新台币</option>
                </select>
              </label>
              <label class="plan-monthly"><input type="checkbox" name="monthlyOnly" value="1">仅看月付</label>
              <button class="directory-button plan-submit" type="submit">查找</button>
            </div>
          </div>
        </div>

        <div class="directory-wrap plan-results-heading">
          <div class="plan-section-heading">
            <h2 id="plan-list-title" tabindex="-1">套餐目录</h2>
            <p id="status" role="status">正在查找…</p>
          </div>
          <input type="hidden" name="criterion" value="cheap">
          <div class="plan-criteria" role="group" aria-label="浏览维度">
            <button type="button" data-criterion="cheap" aria-pressed="true">月均费用</button>
            <button type="button" data-criterion="value" aria-pressed="false">每 GB</button>
            <button type="button" data-criterion="stability" aria-pressed="false">稳定性</button>
            <button type="button" data-criterion="speed" aria-pressed="false">速度</button>
          </div>
          <details class="plan-advanced">
            <summary>按文字需求查找</summary>
            <div class="plan-advanced-controls">
              <label><span>你的需求</span><input name="needs" placeholder="例如：每月20元以内 性价比" maxlength="300"></label>
              <button class="directory-button" type="submit">查找</button>
              <button id="search-reset" class="directory-button" type="button">重置筛选</button>
            </div>
            <div class="quick-bar" aria-label="快捷预算示例">
              <button type="button" class="chip" data-preset-needs="每月15元以内 便宜">15 元内低价</button>
              <button type="button" class="chip" data-preset-needs="每月20元以内 性价比">20 元内性价比</button>
              <button type="button" class="chip" data-preset-needs="每月35元以内 性价比">35 元内性价比</button>
            </div>
          </details>
        </div>
      </form>
      <div class="directory-wrap">
        <div id="results" class="plan-results"></div>
        <div id="plan-pagination" class="pagination" hidden>
          <button id="plan-previous" class="directory-button" type="button">上一页</button>
          <span id="plan-page-label" class="page-indicator" role="status"></span>
          <button id="plan-next" class="directory-button" type="button">下一页</button>
        </div>
        <details class="plan-method">
          <summary>标价与计算口径</summary>
          <p>套餐价为来源页面所列周期总额，月均按套餐月数折算，日均按一年 365 天估算。每 GB 使用同周期内已明确的流量额度，金额按原币展示。</p>
          <p id="snapshot-badge" hidden></p>
        </details>
      </div>
    </section>

    <section id="catalog" class="section directory-wrap" hidden>
      <div class="section-heading">
        <div>
          <p id="stat-primary" class="muted"></p>
          <h2>机场列表</h2>
        </div>
        <p id="catalog-meta" class="muted" role="status"></p>
      </div>

      <form id="catalog-form" class="filter-bar">
        <label class="grow">
          <span>搜索机场</span>
          <input name="q" type="search" placeholder="输入名称、编号（如 A042）或域名关键词" maxlength="200">
        </label>
        <label>
          <span>目录范围</span>
          <select name="scope">
            <option value="primary" selected>主目录</option>
            <option value="all">全部记录</option>
            <option value="other">补充记录</option>
          </select>
        </label>
        <label>
          <span>支付方式</span>
          <input name="payment" placeholder="例如：支付宝" maxlength="80">
        </label>
        <label>
          <span>报价资料</span>
          <select name="price">
            <option value="">全部</option>
            <option value="available">有报价</option>
            <option value="missing">暂无报价</option>
          </select>
        </label>
        <label>
          <span>退款说明</span>
          <select name="refund">
            <option value="">全部</option>
            <option value="available">有说明</option>
            <option value="missing">暂无说明</option>
          </select>
        </label>
        <div class="filter-actions">
          <button type="submit">查找</button>
          <button id="catalog-reset" class="button-secondary" type="button">重置</button>
        </div>
      </form>

      <div class="quick-bar" aria-label="常用支付方式快捷筛选">
        <span class="quick-label">常见支付：</span>
        <button type="button" class="chip" data-payment="">全部</button>
        <button type="button" class="chip" data-payment="支付宝">支付宝</button>
        <button type="button" class="chip" data-payment="微信支付">微信支付</button>
        <button type="button" class="chip" data-payment="USDT">USDT</button>
      </div>

      <div id="catalog-error" class="error load-error" hidden>
        <p id="catalog-error-message" role="alert"></p>
        <button id="catalog-retry" class="button-secondary" type="button">重试</button>
      </div>
      <div id="catalog-results" class="card-grid" aria-live="polite"></div>

      <div class="pagination">
        <button id="previous" class="button-secondary" type="button" disabled>上一页</button>
        <span id="page-label" class="page-indicator"></span>
        <button id="next" class="button-secondary" type="button" disabled>下一页</button>
      </div>
    </section>

  </main>

  <main id="detail" class="detail-shell" hidden>
    <div class="detail-nav">
      <a class="back-link" id="detail-back" href="#catalog">← 返回机场列表</a>
    </div>
    <div id="detail-content" aria-live="polite"></div>
    <div id="detail-error" class="error load-error" hidden>
      <p id="detail-error-message" role="alert"></p>
      <button id="detail-retry" class="button-secondary" type="button">重试</button>
    </div>
  </main>

  <dialog id="plan-comparison" aria-labelledby="plan-comparison-title">
    <header class="plan-section-heading">
      <h2 id="plan-comparison-title">套餐对比</h2>
      <form method="dialog"><button type="submit" class="directory-button" autofocus>关闭</button></form>
    </header>
    <p>金额按各套餐原币显示。</p>
    <button id="clear-plan-comparison" type="button" class="directory-button">清空</button>
    <div id="plan-comparison-content" tabindex="0" role="region" aria-label="套餐对比表"></div>
  </dialog>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="brand-title">航向</span>
        <p>价格与条款以各站点实际结算页为准；材料更新不等于付费可用，未知明确保留。暂无统一可比实测时，不提供速度或稳定性排名。部分入口含已披露的用户推荐链接。</p>
      </div>
      <span class="footer-admin-link" title="管理接口需独立域名与服务端鉴权">管理接口受服务端鉴权保护</span>
    </div>
  </footer>
</body>
</html>
