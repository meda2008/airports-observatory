<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amy服务会话接管 · 机场后台</title><style>body{font:16px/1.6 system-ui;margin:24px;color:#182334;background:#f6f8fb}main{max-width:1300px;margin:auto}button,input{font:inherit;padding:8px 12px;margin:4px;min-height:44px}button{cursor:pointer}button:disabled{cursor:wait}figure{margin:16px 0;background:white;border:1px solid #bcc9d9;overflow:auto}img{display:block;max-width:100%;height:auto}pre{white-space:pre-wrap;background:white;padding:12px}label{display:inline-block}input[type=number]{width:90px}</style><script src="/api/admin/assistance-script" defer></script></head><body><main><h1>Amy · Oracle同一服务会话</h1><p>这里显示Oracle采集器的真实浏览器画面。只允许在验证页操作；离开验证页后禁止远程点击。无需填写机场账号、购买或付款。</p><p>会话保留1小时。刷新画面不会刷新官网。完成验证后点击“验证完成并续采”，后台会核验套餐、保存私有会话并排入采集；新数据仍须复核。</p><nav aria-label="服务会话操作"><button id="start" type="button">打开或恢复当前会话</button><button id="snapshot" type="button">刷新画面</button><button id="resume" type="button">验证完成并续采</button><button id="cancel" type="button">结束接管</button></nav><p id="status" role="status" aria-live="polite">正在读取服务状态</p><p id="error" role="alert"></p><figure><img id="screen" alt="Oracle中Amy的当前验证画面；也可通过下方坐标表单操作" hidden><figcaption id="description">等待画面。点击画面中的验证控件会发送一次正常鼠标点击。</figcaption></figure><form id="coordinates"><fieldset><legend>坐标点击（键盘操作替代方式）</legend><p id="hint">画面原始尺寸1280×900。仅当前验证画面接受点击，过期画面需刷新。</p><label for="x">横坐标X</label><input id="x" name="x" type="number" min="0" max="1279" required aria-describedby="hint"><label for="y">纵坐标Y</label><input id="y" name="y" type="number" min="0" max="899" required aria-describedby="hint"><button type="submit" id="click">发送点击</button></fieldset></form><h2>当前服务状态</h2><pre id="details"></pre><p><a href="/console">返回管理控制台</a></p></main></body></html>
