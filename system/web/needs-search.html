<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>按需求找套餐</title><link rel="stylesheet" href="/needs-search.css"><script src="/needs-search.js" defer></script></head><body><main><a href="/">返回资料目录</a><h1>按需求找套餐</h1><p>用已有证据筛选页面标价。速度和稳定性没有可比实测时，明确不排名。</p><form id="search"><label>需求<select name="criterion"><option value="cheap">便宜：月均标价低</option><option value="value">流量性价比：每 GB 标价低</option><option value="speed">速度快</option><option value="stability">稳定</option></select></label><label>币种<select name="currency"><option>CNY</option><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option><option>HKD</option><option>TWD</option></select></label><label>月均预算上限<input name="maxMonthly" type="number" min="0.01" step="0.01" placeholder="不限"></label><label>名称或域名<input name="q" maxlength="200" type="search"></label><button type="submit">筛选</button></form><p id="status" role="status" aria-live="polite"></p><ul id="limitations"></ul><section id="results" aria-label="搜索结果"></section></main></body></html>
