name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
      - name: Install deploy-service dependencies
        run: npm --prefix deploy-service ci
      - name: Install Playwright Chromium
        run: npx --prefix deploy-service playwright install --with-deps chromium
      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test
